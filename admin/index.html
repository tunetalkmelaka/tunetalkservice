<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TuneTalk V8.3 Enterprise CMS</title><style>
:root{--r:#ed111b;--bg:#f3f5f7;--card:#fff;--ink:#171717;--muted:#6b7280;font-family:Inter,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.wrap{max-width:1240px;margin:auto;padding:22px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px #00000010;margin-bottom:16px}h1,h2,h3{margin:0 0 14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.red{background:var(--r);color:white}.dark{background:#181818;color:white}.ghost{background:#edf0f3}.danger{background:#ffe2e3;color:#a40009}.ok{background:#e4f8e9;color:#087a2f}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}input,textarea,select{width:100%;padding:11px;border:1px solid #d8dce2;border-radius:10px;font:inherit}textarea{min-height:100px}.muted{color:var(--muted);font-size:13px}.item{border:1px solid #e1e4e8;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.thumb{width:190px;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#eee}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;border-radius:14px;background:#f7f8fa}.stat b{font-size:32px;display:block}.status{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800}.msg{margin:10px 0;font-weight:700}.error{color:#b00020}.success{color:#087a2f}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:50}.modalbox{background:#fff;max-width:760px;width:100%;max-height:92vh;overflow:auto;border-radius:18px;padding:20px}.spacer{height:6px}@media(max-width:700px){.wrap{padding:10px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.thumb{width:120px}}
</style></head><body><div class="wrap">
<div class="card top"><div><h1>⚙️ TuneTalk V8.3 Enterprise CMS</h1><div class="muted">D1 + R2 · CMS-only Banner architecture</div></div><span class="status ok">V8.3 Final</span></div>
<div id="setup" class="card hidden"><h2>首次建立管理员</h2><div class="grid"><input id="su" placeholder="Username"><input id="sp" type="password" placeholder="Password（至少10字符）"></div><br><button class="btn red" onclick="setupAdmin()">建立管理员</button><p id="setupMsg"></p></div>
<div id="login" class="card"><h2>后台登入</h2><div class="grid"><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password"></div><br><div class="row"><button class="btn red" onclick="login()">登入</button><button class="btn ghost" onclick="showSetup()">首次使用</button></div><p id="loginMsg"></p></div>
<div id="app" class="hidden"><div class="card nav"><button class="btn dark" onclick="tab('dashboard')">📊 Dashboard</button><button class="btn dark" onclick="tab('banners')">🖼 Banner</button><button class="btn dark" onclick="tab('knowledge')">🤖 TT Buddy</button><button class="btn dark" onclick="tab('settings')">🌐 网站设置</button><button class="btn dark" onclick="tab('logs')">🧾 操作记录</button><button class="btn ghost" onclick="backup()">💾 导出备份</button><button class="btn ghost" onclick="logout()">退出</button></div>
<section id="dashboard" class="card"><h2>Dashboard</h2><div class="stats"><div class="stat"><span>Banner</span><b id="dsB">0</b></div><div class="stat"><span>显示中的 Banner</span><b id="dsE">0</b></div><div class="stat"><span>TT Buddy 问答</span><b id="dsK">0</b></div></div></section>
<section id="banners" class="card hidden"><div class="top"><div><h2>轮播 Banner</h2><div class="muted">正式网站只读取这里的 Banner，不再使用 GitHub 写死图片。</div></div><button class="btn red" onclick="openBanner()">＋ 新增</button></div><p id="bannerMsg"></p><div id="bannerList"></div></section>
<section id="knowledge" class="card hidden"><div class="top"><h2>TT Buddy 知识库</h2><button class="btn red" onclick="openKnowledge()">＋ 新增</button></div><div class="grid"><input id="knowledgeSearch" placeholder="搜索问题/关键词" oninput="renderKnowledge()"><select id="knowledgeLang" onchange="renderKnowledge()"><option value="">全部语言</option><option value="zh-CN">中文</option><option value="ms-MY">Bahasa Melayu</option><option value="en-MY">English</option></select></div><p id="knowledgeMsg"></p><div id="knowledgeList"></div></section>
<section id="settings" class="card hidden"><h2>网站设置</h2><div class="grid"><label>网站名称<input id="s_site_name"></label><label>WhatsApp（6010...）<input id="s_whatsapp"></label></div><div class="spacer"></div><label>SEO Title<input id="s_seo_title"></label><div class="spacer"></div><label>SEO Description<textarea id="s_seo_description"></textarea></label><button class="btn red" onclick="saveSettings()">保存设置</button><span id="settingsMsg" class="msg"></span><hr><h3>修改管理员密码</h3><div class="row"><input id="newPassword" type="password" style="max-width:360px" placeholder="新密码（至少10字符）"><button class="btn dark" onclick="changePassword()">修改密码</button></div></section>
<section id="logs" class="card hidden"><h2>最近操作</h2><div id="logList"></div></section></div>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="top"><h2 id="modalTitle">编辑</h2><button class="btn ghost" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const API=location.origin;let token=localStorage.cmsToken||'',banners=[],knowledge=[];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function m(id,t,ok=false){const e=$(id);if(!e)return;e.textContent=t;e.className='msg '+(ok?'success':'error')}async function req(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(API+path,opt);const j=await r.json().catch(()=>({error:'Invalid response'}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function showSetup(){$('login').classList.add('hidden');$('setup').classList.remove('hidden')}async function setupAdmin(){try{await req('/api/setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('su').value,password:$('sp').value})});m('setupMsg','建立成功，请重新登入。',true);setTimeout(()=>location.reload(),900)}catch(e){m('setupMsg',e.message)}}async function login(){try{const j=await req('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('lu').value,password:$('lp').value})});token=j.token;localStorage.cmsToken=token;start()}catch(e){m('loginMsg',e.message)}}function logout(){localStorage.removeItem('cmsToken');location.reload()}function tab(id){['dashboard','banners','knowledge','settings','logs'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='dashboard')loadDashboard();if(id==='banners')loadBanners();if(id==='knowledge')loadKnowledge();if(id==='settings')loadSettings();if(id==='logs')loadLogs()}
async function start(){try{await req('/api/me');$('login').classList.add('hidden');$('setup').classList.add('hidden');$('app').classList.remove('hidden');tab('dashboard')}catch{token='';localStorage.removeItem('cmsToken')}}async function loadDashboard(){const j=await req('/api/dashboard');$('dsB').textContent=j.banners;$('dsE').textContent=j.enabled_banners;$('dsK').textContent=j.knowledge}
async function loadBanners(){const j=await req('/api/banners');banners=j.banners;renderBanners()}function renderBanners(){$('bannerList').innerHTML=banners.length?banners.map(b=>`<div class="item"><div class="row"><img class="thumb" src="${esc(b.image_url)}"><div style="flex:1;min-width:200px"><b>${esc(b.title)}</b><div class="muted">排序 ${b.sort_order} · ${b.enabled?'✅ 显示':'⏸ 隐藏'}</div><div class="muted">${esc(b.link_url)}</div></div><button class="btn ghost" onclick="openBanner(${b.id})">编辑</button><button class="btn danger" onclick="delBanner(${b.id})">删除</button></div></div>`).join(''):'<p class="muted">暂无 Banner。点击「新增」上传第一张。</p>'}function openBanner(id){const b=id?banners.find(x=>x.id===id):{title:'',link_url:'#plans',alt_text:'',sort_order:banners.length+1,enabled:1,image_key:''};$('modalTitle').textContent=id?'编辑 Banner':'新增 Banner';$('modalBody').innerHTML=`<div class="grid"><label>标题<input id="mbt" value="${esc(b.title)}"></label><label>点击链接<input id="mbl" value="${esc(b.link_url||'#plans')}"></label><label>排序<input id="mbo" type="number" value="${Number(b.sort_order||0)}"></label><label>显示<select id="mbe"><option value="1" ${b.enabled?'selected':''}>显示</option><option value="0" ${!b.enabled?'selected':''}>隐藏</option></select></label></div><br><label>图片说明<input id="mba" value="${esc(b.alt_text||'')}"></label><br><label>${id?'新图片（不选则保留原图）':'选择图片'}<input id="mbf" type="file" accept="image/png,image/jpeg,image/webp"></label><br><button class="btn red" onclick="saveBanner(${id||0},'${esc(b.image_key||'')}')">保存</button>`;$('modal').classList.remove('hidden')}async function saveBanner(id,oldKey){try{let key=oldKey;const f=$('mbf').files[0];if(f){const fd=new FormData();fd.append('file',f);key=(await req('/api/upload',{method:'POST',body:fd})).key}if(!key)throw new Error('请选择图片');const body={title:$('mbt').value,image_key:key,link_url:$('mbl').value||'#plans',alt_text:$('mba').value,sort_order:Number($('mbo').value||0),enabled:$('mbe').value==='1'};await req(id?'/api/banners/'+id:'/api/banners',{method:id?'PUT':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});closeModal();await loadBanners();m('bannerMsg','保存成功，正式网站读取 CMS 后会自动更新。',true)}catch(e){alert(e.message)}}async function delBanner(id){if(!confirm('确定删除这张 Banner？图片也会从 R2 删除。'))return;await req('/api/banners/'+id,{method:'DELETE'});loadBanners()}
async function loadKnowledge(){const j=await req('/api/knowledge');knowledge=j.items;renderKnowledge()}function renderKnowledge(){const q=($('knowledgeSearch')?.value||'').toLowerCase(),l=$('knowledgeLang')?.value||'';const a=knowledge.filter(x=>(!l||x.language===l)&&(!q||(x.question+' '+x.answer+' '+(x.keywords||'')).toLowerCase().includes(q)));$('knowledgeList').innerHTML=a.length?a.map(x=>`<div class="item"><b>${esc(x.question)}</b><div class="muted">${x.language} · ${x.enabled?'显示':'隐藏'} · ${esc(x.keywords||'')}</div><p>${esc(x.answer)}</p><button class="btn ghost" onclick="openKnowledge(${x.id})">编辑</button> <button class="btn danger" onclick="delKnowledge(${x.id})">删除</button></div>`).join(''):'<p class="muted">暂无符合的问答。</p>'}function openKnowledge(id){const x=id?knowledge.find(v=>v.id===id):{question:'',answer:'',keywords:'',language:'zh-CN',enabled:1};$('modalTitle').textContent=id?'编辑 TT Buddy 问答':'新增 TT Buddy 问答';$('modalBody').innerHTML=`<label>问题<input id="mkq" value="${esc(x.question)}"></label><br><div class="grid"><label>语言<select id="mkl"><option value="zh-CN" ${x.language==='zh-CN'?'selected':''}>中文</option><option value="ms-MY" ${x.language==='ms-MY'?'selected':''}>Bahasa Melayu</option><option value="en-MY" ${x.language==='en-MY'?'selected':''}>English</option></select></label><label>关键词<input id="mkk" value="${esc(x.keywords||'')}"></label><label>显示<select id="mke"><option value="1" ${x.enabled?'selected':''}>显示</option><option value="0" ${!x.enabled?'selected':''}>隐藏</option></select></label></div><br><label>答案<textarea id="mka">${esc(x.answer)}</textarea></label><br><button class="btn red" onclick="saveKnowledge(${id||0})">保存</button>`;$('modal').classList.remove('hidden')}async function saveKnowledge(id){try{const body={question:$('mkq').value,answer:$('mka').value,keywords:$('mkk').value,language:$('mkl').value,enabled:$('mke').value==='1'};await req(id?'/api/knowledge/'+id:'/api/knowledge',{method:id?'PUT':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});closeModal();loadKnowledge();m('knowledgeMsg','保存成功',true)}catch(e){alert(e.message)}}async function delKnowledge(id){if(!confirm('确定删除？'))return;await req('/api/knowledge/'+id,{method:'DELETE'});loadKnowledge()}
async function loadSettings(){const j=await req('/api/settings'),s=j.settings||{};['site_name','whatsapp','seo_title','seo_description'].forEach(k=>{const e=$('s_'+k);if(e)e.value=s[k]||''})}async function saveSettings(){try{const settings={site_name:$('s_site_name').value,whatsapp:$('s_whatsapp').value,seo_title:$('s_seo_title').value,seo_description:$('s_seo_description').value};await req('/api/settings',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({settings})});m('settingsMsg','已保存',true)}catch(e){m('settingsMsg',e.message)}}async function changePassword(){try{await req('/api/change-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('newPassword').value})});alert('密码已更新，请重新登录。');logout()}catch(e){alert(e.message)}}async function loadLogs(){const j=await req('/api/logs');$('logList').innerHTML=j.items.map(x=>`<div class="item"><b>${esc(x.action)}</b> · ${esc(x.username)}<div class="muted">${esc(x.created_at)} · ${esc(x.detail)}</div></div>`).join('')||'<p class="muted">暂无记录</p>'}async function backup(){const j=await req('/api/backup'),blob=new Blob([JSON.stringify(j,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tunetalk-v83-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}function closeModal(){$('modal').classList.add('hidden');$('modalBody').innerHTML=''}if(token)start();
</script></body></html>
